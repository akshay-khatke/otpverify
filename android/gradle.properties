# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Memory-optimized JVM heap to prevent Windows out-of-memory crashes
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC

# Kotlin daemon JVM arguments with minimal memory footprint
kotlin.daemon.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -XX:-UseParallelGC -XX:+UseG1GC

# Disable parallel builds and run on 1 worker thread to avoid RAM exhaustion
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX package structure
android.useAndroidX=true

# Target only active Emulator architecture (x86_64) to save 75% C++ build memory
# (When building for physical device, change to arm64-v8a)
reactNativeArchitectures=x86_64

# New Architecture & Hermes
newArchEnabled=true
hermesEnabled=true

# Edge-to-edge support
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior
android.builtInKotlin=false
android.newDsl=false
