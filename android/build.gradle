buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.15.0"
            force "androidx.core:core-ktx:1.15.0"
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'androidx.core' && details.requested.name.startsWith('core')) {
                    details.useVersion '1.15.0'
                }
            }
        }
    }

    // Disable all lintVital tasks so third-party libraries (e.g. react-native-keychain) do not fail release builds
    tasks.configureEach { task ->
        if (task.name.startsWith("lintVital") || task.name.contains("LintVital")) {
            task.enabled = false
        }
    }
}
